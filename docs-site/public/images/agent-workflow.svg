<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Emoera CLI workflow</title>
  <desc id="desc">Developers and agents use the CLI to call scoped APIs, retrieval, and grounded answers.</desc>
  <rect width="1200" height="480" fill="#eee7d6"/>
  <g fill="none" stroke="#1c1a17" stroke-width="2">
    <path d="M240 240h120M520 240h120M800 240h120"/>
    <path d="m345 230 15 10-15 10m280-20 15 10-15 10m280-20 15 10-15 10" fill="#1c1a17"/>
  </g>
  <g font-family="ui-sans-serif, system-ui" text-anchor="middle">
    <g transform="translate(60 120)"><rect width="180" height="240" fill="#f7f3e8" stroke="#1c1a17" stroke-width="2"/><text x="90" y="66" fill="#d9342b" font-family="ui-monospace,monospace" font-size="14" font-weight="700">01 / CALLER</text><text x="90" y="118" fill="#1c1a17" font-size="27" font-weight="800">Developer</text><text x="90" y="154" fill="#716b61" font-size="16">or AI Agent</text><text x="90" y="205" fill="#716b61" font-size="13">terminal · script · CI</text></g>
    <g transform="translate(360 120)"><rect width="160" height="240" fill="#181a20" stroke="#1c1a17" stroke-width="2"/><circle cx="80" cy="77" r="34" fill="#d9342b"/><text x="80" y="88" fill="white" font-family="Georgia,serif" font-size="34" font-weight="700">E</text><text x="80" y="146" fill="#fff" font-size="25" font-weight="800">CLI</text><text x="80" y="180" fill="#aaa59a" font-size="13">profiles · output</text><text x="80" y="205" fill="#aaa59a" font-size="13">request tracing</text></g>
    <g transform="translate(640 120)"><rect width="160" height="240" fill="#f7f3e8" stroke="#1c1a17" stroke-width="2"/><text x="80" y="66" fill="#d9342b" font-family="ui-monospace,monospace" font-size="14" font-weight="700">02 / POLICY</text><text x="80" y="124" fill="#1c1a17" font-size="25" font-weight="800">Scoped API</text><text x="80" y="164" fill="#716b61" font-size="14">token · quota</text><text x="80" y="192" fill="#716b61" font-size="14">organization</text></g>
    <g transform="translate(920 120)"><rect width="220" height="240" fill="#f7f3e8" stroke="#1c1a17" stroke-width="2"/><text x="110" y="66" fill="#d9342b" font-family="ui-monospace,monospace" font-size="14" font-weight="700">03 / KNOWLEDGE</text><text x="110" y="120" fill="#1c1a17" font-size="25" font-weight="800">RAG Pipeline</text><text x="110" y="162" fill="#716b61" font-size="14">retrieve · rerank</text><text x="110" y="190" fill="#716b61" font-size="14">grounded answer</text></g>
  </g>
</svg>
